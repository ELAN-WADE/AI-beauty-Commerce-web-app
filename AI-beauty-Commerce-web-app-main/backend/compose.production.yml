# API and worker only: provision managed private PostgreSQL, encrypted object
# storage, SMTP and TLS proxy separately. Do not use root docker-compose.yml.
services:
  migrate:
    build:
      context: .
      target: worker
    env_file: .env.production
    command: ["sh", "-c", "node preflight.mjs && ./node_modules/.bin/tsx src/db/migrate.ts && exec ./node_modules/.bin/tsx src/db/seed.ts"]
    restart: "no"
  api:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 5m

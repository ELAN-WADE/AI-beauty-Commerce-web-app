<svg id="visual" viewBox="0 0 1200 600" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#E5C365" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0.40" />
    </linearGradient>
    <linearGradient id="gold-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C365" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#C59B27" stop-opacity="0.30" />
    </linearGradient>
    <linearGradient id="gold-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#F3E5AB" stop-opacity="1" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#AA7C11" stop-opacity="0.7" />
    </linearGradient>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crisp White Luxury Canvas -->
  <rect x="0" y="0" width="1200" height="600" fill="#FFFFFF" />

  <!-- Background Ambient Wave Layer (Subtle secondary crest) -->
  <path d="M0 320 C180 260, 320 400, 500 340 C680 280, 820 420, 1020 330 C1120 285, 1180 310, 1200 320 L1200 600 L0 600 Z"
        fill="url(#gold-grad-2)" />

  <!-- Primary Fluid Gold Wave Layer -->
  <path d="M0 420 C150 360, 280 480, 460 410 C640 340, 780 470, 960 400 C1060 360, 1140 390, 1200 410 L1200 600 L0 600 Z"
        fill="url(#gold-grad-1)" />

  <!-- Golden Wave Ribbon 1 (Main sweeping contour line) -->
  <path d="M0 420 C150 360, 280 480, 460 410 C640 340, 780 470, 960 400 C1060 360, 1140 390, 1200 410"
        fill="none" stroke="url(#gold-line-grad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Golden Wave Ribbon 2 (Upper delicate contour line) -->
  <path d="M0 320 C180 260, 320 400, 500 340 C680 280, 820 420, 1020 330 C1120 285, 1180 310, 1200 320"
        fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="6 4" stroke-linecap="round" />

  <!-- Golden Wave Ribbon 3 (Lower accent ripple) -->
  <path d="M0 470 C220 430, 400 520, 620 480 C840 440, 1020 530, 1200 480"
        fill="none" stroke="#E5C365" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round" />
</svg>

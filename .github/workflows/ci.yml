# Root CI — GitHub Actions only reads .github/workflows at the repository root.
# The app lives in AI-beauty-Commerce-web-app-main/ (Next.js app + backend/).
name: ci

on:
  push:
    branches: ['**']
  pull_request:

env:
  NODE_VERSION: '20'

jobs:
  frontend:
    name: storefront typecheck + Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: AI-beauty-Commerce-web-app-main/package-lock.json
      - name: Install
        working-directory: AI-beauty-Commerce-web-app-main
        run: npm ci --no-audit --no-fund
      - name: Audit (fail on high+)
        working-directory: AI-beauty-Commerce-web-app-main
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck + production build
        working-directory: AI-beauty-Commerce-web-app-main
        run: npm run build

  backend:
    name: backend verify (typecheck/test/migrations/image)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glowly
          POSTGRES_PASSWORD: glowly_dev_only
          POSTGRES_DB: glowly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://glowly:glowly_dev_only@localhost:5432/glowly_dev
      TEST_DATABASE_URL: postgres://glowly:glowly_dev_only@localhost:5432/glowly_test
    defaults:
      run:
        working-directory: AI-beauty-Commerce-web-app-main/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AI-beauty-Commerce-web-app-main/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Create isolated concurrency-test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE glowly_test'
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Migrations are committed (generate must be a no-op)
        run: npm run db:generate && git diff --exit-code -- drizzle/
      - name: Migrations apply to empty Postgres + seed roles
        run: npm run db:migrate && npm run db:seed
      - name: Install root storefront for browser integration
        run: npm --prefix .. ci --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Live workspace browser journeys
        run: PLAYWRIGHT_CHANNEL=chromium npm run test:browser
      - name: Production image builds
        working-directory: .
        run: docker build --target runner -t glowly-backend:ci ./AI-beauty-Commerce-web-app-main/backend && docker build --target worker -t glowly-worker:ci ./AI-beauty-Commerce-web-app-main/backend

  secrets:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

name: Delsla Beauty CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-beauty-Commerce-web-app-main/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI-beauty-Commerce-web-app-main/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run unit and integration test suite
        run: npx vitest run --no-file-parallelism
      - name: Production Next.js build
        run: npm run build

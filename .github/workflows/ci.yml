# Glowly CI — owned backend pipeline (§27) + secret scanning.
# Frontend app keeps its own workflow in AI-beauty-Commerce-web-app-main/.github.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: backend verify (lint/type/test/audit/migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Production attack surface only: dev-tool advisories (vitest/vite/esbuild)
      # never ship in the standalone image. Tracked separately, not gated here.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Migrations are committed (generate must be a no-op)
        run: npm run db:generate && git diff --exit-code -- drizzle/
      - name: Production image builds
        run: docker build -t glowly-backend:ci ./backend
        working-directory: .

  secrets:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

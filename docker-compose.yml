# Glowly local development infrastructure.
# No Docker on this machine? The backend still typechecks/tests (unit).
# Run Postgres + Redis + MinIO + MailHog where Docker exists (staging/VPS):
#   docker compose up -d postgres redis minio mailhog
# Backend connects via backend/.env (copy from backend/.env.example).

name: glowly

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glowly
      POSTGRES_PASSWORD: glowly_dev_only
      POSTGRES_DB: glowly_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: glowly
      MINIO_ROOT_PASSWORD: glowlyminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

volumes:
  pgdata:
  redisdata:
  minio-data:
